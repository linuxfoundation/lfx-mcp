name: MegaLinter

"on":
  pull_request: null

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Git Checkout
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # MegaLinter
      - name: MegaLinter
        id: ml
        # Use the Go flavor. Keep this version in sync with the
        # `megalinter` target in the Makefile.
        uses: oxsecurity/megalinter/flavors/go@9949bad031045f366be2467e00e8371a7328a2e2  # v10.1.0
        env:
          # Only Actions-specific values (secrets, runner behavior) belong
          # here. Generic MegaLinter/repo config belongs in .mega-linter.yml
          # so local runs (e.g. mega-linter-runner) get the same behavior.
          #
          # All available variables are described in documentation
          # https://megalinter.io/latest/configuration/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Lets Go-based linters download the go.mod toolchain when it is
          # newer than the Go bundled in the MegaLinter image.
          GOTOOLCHAIN: auto
          # Allow GITHUB_TOKEN for working around rate limits (aquasecurity/trivy#7668).
          REPOSITORY_TRIVY_UNSECURED_ENV_VARIABLES: GITHUB_TOKEN
          # zizmor's online audits (e.g. resolving action refs/tags to the
          # pinned SHAs) query the GitHub API, which requires GITHUB_TOKEN.
          ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES: GITHUB_TOKEN
